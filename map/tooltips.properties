tooltip.unit.uruloke.append=Flying, Creature<br/>Tactics: <b>Average</b><br/>&nbsp;&nbsp;+2 hill<br/>&nbsp;&nbsp;-2 forest<br/><br/><br/>Terrifyingly powerful flying beasts. A threat to all fortified cities within range. At their strongest when<br/>supporting a large army. Vulnerable to defending archers.<br/><br/><i>The Uruloki, or fire-drakes, were the most powerful dragons. They could breathe fire and usually had wings.<br/>There were still a number of them left in the Third Age, including Smaug.</i>
tooltip.unit.winged_nazgul.append=Flying<br/>Tactics: <b>Excellent</b><br/>&nbsp;&nbsp;+2 hill, marsh<br/>&nbsp;&nbsp;-3 forest, cave<br/><br/><br/>A two-hit flying beast and a leader in one unit. Mobile, flexible, and survivable, though vulnerable to archers.<br/>Best used in a support role to empower large armies or to decide small battles.<br/><br/><i>The Nazgul, or Ringwraiths, were lords of mortal men turned into wraiths by the Nine Rings of Power.<br/>Riding the flying creatures of Mordor known as fell beasts, they were referred to as winged Nazgul.</i>
